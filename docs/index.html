<style>

}

input:focus,textarea:focus{outline:2px solid rgba(255,210,63,.5);border-color:transparent}
textarea{min-height:90px;resize:vertical}
.net{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:center;margin:8px 0}
.net input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}.net input[type=datetime-local]{min-width:0}
.mut{color:var(--mut);font-size:13px}

.empty{color:var(--mut);text-align:center;padding:34px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:999px;padding:7px 13px;font:600 13px Inter;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:0 0 6px}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px}
.chart{position:relative}.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--mut);font:11px Inter}
#tip{position:fixed;z-index:50;pointer-events:none;background:#0b0c10f0;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:var(--sh);display:none;max-width:260px}
#tip b{font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}

.tablewrap{overflow-x:auto}
.fade{animation:fade .35s ease both}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--card2),#262a36,var(--card2));background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}

.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 0}.login-card{max-width:420px;width:100%;margin:0 auto}

 <aside>

 </aside>
 <div class="main">

 </div>

<script>

const O="explicadoen60s",R="explicadoen60s.github.io",API=`https://api.github.com/repos/${O}/${R}`;
const TZ="Europe/Madrid";
const HUECOS={tiktok:[10,13,16,18,21],instagram:[10,18],youtube:[12,16]};
const REDES=["tiktok","instagram","youtube"];
const EST={pendiente:"⏳ Pendiente",publicado:"✅ Publicado",borrador:"📲 En tu bandeja",error:"❌ Error",caducado:"⚠️ No salió"};
let tok="";try{tok=localStorage.getItem("ghtoken")||""}catch(e){}
let tab="cal",cal=null,calSha=null,TEXTOS=[];
const $=s=>document.querySelector(s); let app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ── GitHub ──
async function gh(path,opt={}){
  const r=await fetch(path.startsWith("http")?path:API+path,{...opt,headers:{Authorization:`Bearer ${tok}`,Accept:"application/vnd.github+json",...(opt.headers||{})}});
  if(!r.ok){const t=await r.text();const e=new Error(`GitHub ${r.status}: ${t.slice(0,200)}`);e.status=r.status;throw e}
  return r.status===204?null:r.json();
}
const b64e=s=>btoa(unescape(encodeURIComponent(s))), b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
async function leerArchivo(p){const j=await gh(`/contents/${p}?ref=main&t=${Date.now()}`);return {txt:b64d(j.content),sha:j.sha}}
async function cargarCal(){const f=await leerArchivo("programador/calendario.json");cal=JSON.parse(f.txt);calSha=f.sha;return cal}
async function guardarCal(cambio,msg){
  for(let i=0;i<4;i++){
    await cargarCal();cambio(cal);
    cal.posts.sort((a,b)=>new Date(a.hora)-new Date(b.hora)||a.red.localeCompare(b.red));
    try{const j=await gh("/contents/programador/calendario.json",{method:"PUT",body:JSON.stringify({message:msg+" [skip ci]",content:b64e(JSON.stringify(cal,null,1)+"\n"),sha:calSha,branch:"main"})});calSha=j.content.sha;return}
    catch(e){if(e.status!==409&&e.status!==422)throw e;await new Promise(r=>setTimeout(r,1500))}
  }
  throw new Error("No se pudo guardar: el calendario cambió a la vez. Vuelve a intentarlo.");
}
async function editarJson(ruta,cambio,msg){
  for(let i=0;i<4;i++){
    const f=await leerArchivo(ruta),d=JSON.parse(f.txt);cambio(d);
    try{await gh(`/contents/${ruta}`,{method:"PUT",body:JSON.stringify({message:msg,content:b64e(JSON.stringify(d,null,1)+"\n"),sha:f.sha,branch:"main"})});return d}
    catch(e){if(e.status!==409&&e.status!==422)throw e;await new Promise(r=>setTimeout(r,1500))}
  }
  throw new Error("No se pudo guardar: cambió a la vez. Vuelve a intentarlo.");
}
async function lanzar(probar=false){await gh("/actions/workflows/publicar.yml/dispatches",{method:"POST",body:JSON.stringify({ref:"main",inputs:{probar}})})}

// ── Fechas (hora de Madrid) ──
function partes(d){const o={};new Intl.DateTimeFormat("en-GB",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(d).forEach(p=>o[p.type]=p.value);return o}
function aLocal(iso){const p=partes(new Date(iso));return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`}
function aIso(local){ // "YYYY-MM-DDTHH:MM" en Madrid -> ISO con desfase
  const [d,t]=local.split("T"),[Y,M,D]=d.split("-").map(Number),[h,m]=t.split(":").map(Number);
  const utc=Date.UTC(Y,M-1,D,h,m),p=partes(new Date(utc));
  const off=Math.round((Date.UTC(+p.year,p.month-1,+p.day,+p.hour,+p.minute)-utc)/60000);
  const s=off>=0?"+":"-",a=Math.abs(off);
  return `${d}T${t}:00${s}${String(a/60|0).padStart(2,"0")}:${String(a%60).padStart(2,"0")}`;
}
const fmtDia=iso=>new Date(iso).toLocaleDateString("es-ES",{timeZone:TZ,weekday:"long",day:"numeric",month:"long"});
const fmtHora=iso=>new Date(iso).toLocaleTimeString("es-ES",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});
function siguienteHueco(red,ocupados){
  const ahora=Date.now()+15*60000;
  for(let d=0;d<30;d++){
    const base=new Date(Date.now()+d*864e5),p=partes(base);
    for(const h of HUECOS[red]){
      const loc=`${p.year}-${p.month}-${p.day}T${String(h).padStart(2,"0")}:00`,iso=aIso(loc);
      if(new Date(iso)<ahora)continue;
      if(!ocupados.some(x=>x.red===red&&Math.abs(new Date(x.hora)-new Date(iso))<30*60000))return loc;
    }
  }
}

// ── Vistas ──
// ════════════ Inicio de sesión ════════════
const USUARIOS=["Nikoloz_Lekishvili","Christian_Civico"];
let usuario="";try{usuario=localStorage.getItem("usuario")||""}catch(e){}
if(!usuario)tok="";
const enc=new TextEncoder(),dec=new TextDecoder();
const b64a=a=>btoa(String.fromCharCode(...new Uint8Array(a))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function claveDe(user,pass,salt){const k=await crypto.subtle.importKey("raw",enc.encode(user.toLowerCase()+"\n"+pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function cifrar(user,pass,texto){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await claveDe(user,pass,salt);return {salt:b64a(salt),iv:b64a(iv),ct:b64a(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,enc.encode(texto)))}}
async function descifrar(user,pass,o){const k=await claveDe(user,pass,unb64(o.salt));return dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},k,unb64(o.ct)))}
async function leerAcceso(){try{const r=await fetch("acceso.json?t="+Date.now(),{cache:"no-store"});return r.ok?await r.json():null}catch(e){return null}}
function marcoLogin(html){document.body.classList.add("sinsesion");$("#app").innerHTML=`<div class="login fade"><div class="card login-card">
  <div class="brand" style="padding:0 0 14px"><div class="logo">60s</div><div><b>explicadoen60s</b><small>Panel de control</small></div></div>${html}</div>
  <p class="mut" style="text-align:center;max-width:420px;margin:14px auto">Herramienta privada de @explicadoen60s para programar y publicar sus propios vídeos en TikTok, Instagram y YouTube.<br><a href="privacidad.html">Privacidad</a> · <a href="terminos.html">Términos</a></p></div>`;app=$("#app")}
function pantallaToken(err){
  marcoLogin(`<h2 style="margin:0 0 4px">Iniciar sesión</h2><p class="mut" style="margin:0 0 6px">Entra con tu usuario del equipo.</p>
  ${err?`<div class="msg err">${esc(err)}</div>`:""}
  <label for="lu">Usuario</label><input id="lu" autocomplete="username" value="${esc(usuario)}" placeholder="Nombre_Apellido">
  <label for="lp">Contraseña</label><input id="lp" type="password" autocomplete="current-password">
  <p><button class="btn" id="entrar" style="width:100%">Entrar</button></p>
  <p class="mut" style="text-align:center;margin:0"><a href="#" id="cfg">Configurar el acceso (primera vez o clave de GitHub caducada)</a></p>`);
  const go=async()=>{const u=USUARIOS.find(x=>x.toLowerCase()===$("#lu").value.trim().toLowerCase()),pw=$("#lp").value;
    if(!u)return pantallaToken("Ese usuario no existe.");
    $("#entrar").disabled=true;$("#entrar").textContent="Comprobando…";
    const acc=await leerAcceso();if(!acc||!acc.usuarios?.[u])return pantallaConfig("Primero hay que configurar el acceso (solo una vez).");
    try{tok=await descifrar(u,pw,acc.usuarios[u])}catch(e){usuario=u;return pantallaToken("Contraseña incorrecta.")}
    try{await cargarCal()}catch(e){return pantallaConfig("La clave de GitHub guardada ya no funciona (¿caducó?). Configura una nueva.")}
    usuario=u;try{localStorage.setItem("ghtoken",tok);localStorage.setItem("usuario",u)}catch(e){}
    document.body.classList.remove("sinsesion");ir("inicio")};
  $("#entrar").onclick=go;$("#lp").onkeydown=e=>{if(e.key==="Enter")go()};
  $("#cfg").onclick=e=>{e.preventDefault();pantallaConfig()};
}
function pantallaConfig(err){
  marcoLogin(`<h2 style="margin:0 0 4px">Configurar el acceso</h2>
  <p class="mut">Se hace una sola vez. La clave de GitHub se guarda <b>cifrada con la contraseña</b>: sin la contraseña no sirve de nada.</p>
  ${err?`<div class="msg warn">${esc(err)}</div>`:""}
  <ol class="mut" style="padding-left:18px"><li>Con la cuenta <b>explicadoen60s</b>, abre <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">crear token</a>.</li>
  <li>Caducidad: la más larga posible. Repository access: <b>Only select repositories</b> → <i>${R}</i>.</li>
  <li>Permissions → <b>Contents</b>, <b>Actions</b> e <b>Issues</b>: <i>Read and write</i>. Genera y copia.</li></ol>

function slug(t){return t.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,40)||"video"}
async function programar(){
  const msg=(t,c="ok")=>$("#nmsg").innerHTML=`<div class="msg ${c}">${t}</div>`;
  const titulo=$("#ti").value.trim(),texto=$("#tx").value.trim(),tags=$("#tg").value.split(",").map(s=>s.trim().replace(/^#/,"")).filter(Boolean);
  const v1=$("#v1").files[0],v2=$("#v2").files[0];
  const redes=REDES.filter(r=>$("#c_"+r).checked);
  if(!titulo||!texto)return msg("Falta el título o la descripción.","err");
  if(!v1)return msg("Falta el vídeo.","err");
  if(!redes.length)return msg("Elige al menos una red.","err");
  for(const r of redes)if(!$("#h_"+r).value)return msg(`Falta la hora de ${r}.`,"err");
  const base=slug(titulo)+"_"+Date.now().toString(36).slice(-4), n1=base+".mp4", n2=base+"_tiktok.mp4";
  const subir={[n1]:v1};if(v2&&redes.includes("tiktok"))subir[n2]=v2;
  $("#prog").disabled=true;
  try{
    msg("Subiendo el vídeo… no cierres la página.");
    await subirVideos(subir,t=>msg(t));
    msg("Guardando en el calendario…");
    await guardarCal(c=>{for(const r of redes){c.posts.push({id:`${base}-${r}`,red:r,hora:aIso($("#h_"+r).value),video:(r==="tiktok"&&subir[n2])?n2:n1,titulo,texto,tags,estado:"pendiente",intentos:0})}},`Panel: programar ${titulo}`);
    msg(`✅ Programado en ${redes.join(", ")}. Lo verás en el calendario.`);
    setTimeout(()=>ir("cal"),1800);
  }catch(e){msg("No se pudo: "+esc(e.message),"err");$("#prog").disabled=false}
}
async function subirVideos(archivos,progreso){
  // 1º directo al release «videos»; si el navegador lo bloquea, vía rama «subida» (la acción lo pasa al release)
  try{
    const rel=await gh("/releases/tags/videos");
    for(const [n,f] of Object.entries(archivos)){
      progreso(`Subiendo ${n} (${(f.size/1048576).toFixed(1)} MB)…`);
      const r=await fetch(`https://uploads.github.com/repos/${O}/${R}/releases/${rel.id}/assets?name=${encodeURIComponent(n)}`,{method:"POST",headers:{Authorization:`Bearer ${tok}`,"Content-Type":"video/mp4"},body:f});
      if(!r.ok)throw new Error("release "+r.status);
    }
    return;
  }catch(e){if(e.status===401)throw e;console.log("Subida directa no disponible:",e.message)}
  progreso("Subiendo por la vía alternativa…");
  const main=await gh("/git/ref/heads/main"),com=await gh(`/git/commits/${main.object.sha}`);
  const arbol=[];
  for(const [n,f] of Object.entries(archivos)){
    progreso(`Subiendo ${n} (${(f.size/1048576).toFixed(1)} MB)…`);
    const b64=await new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result.split(",")[1]);fr.onerror=ko;fr.readAsDataURL(f)});
    const bl=await gh("/git/blobs",{method:"POST",body:JSON.stringify({content:b64,encoding:"base64"})});
    arbol.push({path:`subida/${n}`,mode:"100644",type:"blob",sha:bl.sha});
  }
  const tr=await gh("/git/trees",{method:"POST",body:JSON.stringify({base_tree:com.tree.sha,tree:arbol})});
  const nc=await gh("/git/commits",{method:"POST",body:JSON.stringify({message:"Vídeos nuevos desde el panel",tree:tr.sha,parents:[main.object.sha]})});
  try{await gh("/git/refs/heads/subida",{method:"PATCH",body:JSON.stringify({sha:nc.sha,force:true})})}
  catch(e){await gh("/git/refs",{method:"POST",body:JSON.stringify({ref:"refs/heads/subida",sha:nc.sha})})}
}

function contar(el,valor){if(valor==null){el.textContent="—";return}const t0=performance.now(),d=900;
  const paso=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=fmtN(Math.round(valor*e));if(p<1&&el.isConnected)requestAnimationFrame(paso)};requestAnimationFrame(paso)}
const tip=$("#tip");
function verTip(e,html){tip.innerHTML=html;tip.style.display="block";const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8),y=Math.min(e.clientY+14,innerHeight-tip.offsetHeight-8);tip.style.left=x+"px";tip.style.top=y+"px"}

function inclinar(el){el.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform=`perspective(700px) rotateY(${x*10}deg) rotateX(${-y*10}deg) translateY(-2px)`});el.addEventListener("pointerleave",()=>el.style.transform="")}

let H3=null;

function heroStart(canvas){
  heroStop();if(!window.THREE)return;
  const T=THREE,r=new T.WebGLRenderer({canvas,antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));
  const sc=new T.Scene(),cam=new T.PerspectiveCamera(32,1,.1,100);cam.position.set(0,0,10);
  sc.add(new T.AmbientLight(0xffffff,.55));const dl=new T.DirectionalLight(0xffffff,1.1);dl.position.set(4,5,6);sc.add(dl);
  const pl=new T.PointLight(0xffd23f,1.2,20);pl.position.set(-3,-2,4);sc.add(pl);
  // moneda «60s»
  const cv=document.createElement("canvas");cv.width=cv.height=512;const c=cv.getContext("2d");
  const g=c.createRadialGradient(200,180,40,256,256,280);g.addColorStop(0,"#ffe680");g.addColorStop(1,"#f2b705");c.fillStyle=g;c.fillRect(0,0,512,512);
  c.strokeStyle="rgba(20,20,26,.25)";c.lineWidth=14;c.beginPath();c.arc(256,256,226,0,7);c.stroke();
  c.translate(256,256);c.rotate(-Math.PI/2);c.translate(-256,-256);
  c.fillStyle="#14141a";c.textAlign="center";c.font="600 46px 'Space Grotesk',sans-serif";c.fillText("explicado en",256,190);
  c.font="700 190px 'Space Grotesk',sans-serif";c.fillText("60s",262,350);
  c.fillStyle="rgba(20,20,26,.2)";c.fillRect(146,388,220,16);c.fillStyle="#14141a";c.fillRect(146,388,165,16);
  const tex=new T.CanvasTexture(cv);tex.anisotropy=4;
  const cara=new T.MeshStandardMaterial({map:tex,metalness:.35,roughness:.35}),canto=new T.MeshStandardMaterial({color:0xe9a800,metalness:.7,roughness:.28});
  const moneda=new T.Mesh(new T.CylinderGeometry(1.5,1.5,.34,96),[canto,cara,cara]);moneda.rotation.x=Math.PI/2;
  const grupo=new T.Group();grupo.add(moneda);sc.add(grupo);
  const anillo=new T.Mesh(new T.TorusGeometry(2.45,.025,12,160,Math.PI*1.5),new T.MeshBasicMaterial({color:0xffd23f,transparent:true,opacity:.75}));sc.add(anillo);
  const orbes=["tiktok","instagram","youtube"].map((k,i)=>{const m=new T.Mesh(new T.SphereGeometry(.34,40,24),new T.MeshStandardMaterial({color:COLOR[k],metalness:.25,roughness:.3,emissive:COLOR[k],emissiveIntensity:.15}));m.userData={f:i*2.1,k};sc.add(m);return m});
  const pg=new T.BufferGeometry(),N=160,pos=new Float32Array(N*3);for(let i=0;i<N*3;i++)pos[i]=(Math.random()-.5)*16;pg.setAttribute("position",new T.BufferAttribute(pos,3));
  const polvo=new T.Points(pg,new T.PointsMaterial({color:0xffd23f,size:.035,transparent:true,opacity:.55}));sc.add(polvo);
  let tx=0,ty=0,vy=0,arr=false,lx=0;
  canvas.onpointermove=e=>{const b=canvas.getBoundingClientRect();tx=((e.clientX-b.left)/b.width-.5);ty=((e.clientY-b.top)/b.height-.5);if(arr){vy+=(e.clientX-lx)*.004;lx=e.clientX}};
  canvas.onpointerdown=e=>{arr=true;lx=e.clientX;canvas.style.cursor="grabbing"};
  addEventListener("pointerup",()=>{arr=false;canvas.style.cursor="grab"});
  const ajustar=()=>{const w=canvas.clientWidth,h=canvas.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;
    const ancho=w<700,k=ancho?.78:1;grupo.position.x=ancho?0:2.6;grupo.position.y=ancho?-1.35:0;grupo.scale.setScalar(k);anillo.scale.setScalar(k);anillo.position.copy(grupo.position);cam.updateProjectionMatrix()};
  const ro=new ResizeObserver(ajustar);ro.observe(canvas);ajustar();
  const t0=performance.now();
  const bucle=()=>{if(!canvas.isConnected)return heroStop();const t=(performance.now()-t0)/1000;
    vy*=.95;grupo.rotation.y+=.006+vy;grupo.rotation.x+=((ty*.5)-grupo.rotation.x)*.05;grupo.position.z=Math.sin(t*1.2)*.12;
    anillo.rotation.z=-t*.35;anillo.rotation.x=.25+ty*.3;anillo.rotation.y=tx*.4;
    orbes.forEach(o=>{const a=t*.6+o.userData.f;const k=grupo.scale.x;o.position.set(grupo.position.x+Math.cos(a)*2.45*k,grupo.position.y+Math.sin(a)*.9*k,Math.sin(a)*1.6);o.rotation.y=t});
    polvo.rotation.y=t*.02;polvo.rotation.x=ty*.1;
    r.render(sc,cam);H3.raf=requestAnimationFrame(bucle)};
  H3={r,ro,raf:0};bucle();
}

function sparkline(serie,color){
  if(!serie||serie.length<2)return `<svg viewBox="0 0 200 46"><line x1="0" y1="40" x2="200" y2="40" stroke="var(--bd)" stroke-width="2" stroke-dasharray="4 5"/></svg>`;
  const mn=Math.min(...serie),mx=Math.max(...serie),sp=mx-mn||1,pts=serie.map((v,i)=>[i/(serie.length-1)*200,40-(v-mn)/sp*34]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 200 46" preserveAspectRatio="none"><defs><linearGradient id="g${color.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d} L200 46 L0 46Z" fill="url(#g${color.slice(1)})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function permisoTexto(r,e){
  if(e.includes("no conectado"))return "no está conectado (Conexiones).";
  if(r==="youtube"&&/insufficient|403|scope/i.test(e))return "falta el permiso de estadísticas: vuelve a pulsar «Conectar YouTube».";
  if(r==="tiktok"&&/scope|permission|401|403/i.test(e))return "falta el permiso de estadísticas: añade user.info.stats y video.list en TikTok Developers y vuelve a conectar.";
  return "no se pudieron actualizar los datos ("+e.slice(0,120)+")";
}
function graficoLinea(el,hist,redes){
  const W=el.clientWidth||700,H=240,m={t:12,r:90,b:26,l:46};
  const series=redes.map(r=>({r,p:hist.map(h=>({f:h.fecha,v:h[r+"_seguidores"]})).filter(x=>x.v!=null)})).filter(s=>s.p.length);
  if(!series.length){el.innerHTML=`<div class="empty">Sin datos todavía.</div>`;return}
  const fechas=[...new Set(hist.map(h=>h.fecha))].sort(),n=Math.max(1,fechas.length-1);
  const mx=Math.max(1,...series.flatMap(s=>s.p.map(x=>x.v)))*1.08;
  const X=f=>m.l+fechas.indexOf(f)/n*(W-m.l-m.r)*(fechas.length>1?1:0)+(fechas.length>1?0:(W-m.l-m.r)/2),Y=v=>m.t+(1-v/mx)*(H-m.t-m.b);
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  for(let i=0;i<=4;i++){const v=mx/4*i,y=Y(v);s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="var(--bd)" stroke-width="1"/><text x="${m.l-8}" y="${y+4}" text-anchor="end">${fmtN(Math.round(v))}</text>`}
  const marcas=fechas.length<=7?fechas:fechas.filter((_,i)=>i%Math.ceil(fechas.length/6)===0);
  marcas.forEach(f=>s+=`<text x="${X(f)}" y="${H-6}" text-anchor="middle">${f.slice(8)}/${f.slice(5,7)}</text>`);
  series.forEach(({r,p})=>{const d=p.map((x,i)=>(i?"L":"M")+X(x.f)+" "+Y(x.v)).join(" ");
    s+=`<path d="${d}" fill="none" stroke="${COLOR[r]}" stroke-width="2.2" stroke-linejoin="round"/>`;
    p.forEach(x=>s+=`<circle cx="${X(x.f)}" cy="${Y(x.v)}" r="${p.length<3?5:3}" fill="${COLOR[r]}" stroke="var(--card)" stroke-width="2"/>`);
    const u=p[p.length-1];s+=`<text x="${X(u.f)+10}" y="${Y(u.v)+4}" style="fill:var(--fg);font-weight:600">${NOMBRE[r]} ${fmtN(u.v)}</text>`});
  s+=`<line id="cross" x1="0" x2="0" y1="${m.t}" y2="${H-m.b}" stroke="var(--faint)" stroke-dasharray="3 3" visibility="hidden"/><rect x="${m.l}" y="0" width="${W-m.l-m.r}" height="${H}" fill="transparent" id="hit"/></svg>`;
  el.innerHTML=(series.length>1?`<div class="legend">${series.map(x=>`<span><i style="background:${COLOR[x.r]}"></i>${NOMBRE[x.r]}</span>`).join("")}</div>`:"")+s+(fechas.length<2?`<p class="mut">La línea se irá dibujando con un punto nuevo cada día.</p>`:"");
  const hit=el.querySelector("#hit"),cr=el.querySelector("#cross"),svg=el.querySelector("svg");
  hit.onpointermove=e=>{const b=svg.getBoundingClientRect(),x=(e.clientX-b.left)*W/b.width,i=Math.round((x-m.l)/((W-m.l-m.r)/n));const f=fechas[Math.max(0,Math.min(fechas.length-1,i))];
    cr.setAttribute("x1",X(f));cr.setAttribute("x2",X(f));cr.setAttribute("visibility","visible");
    verTip(e,`<b>${new Date(f).toLocaleDateString("es-ES",{day:"numeric",month:"long"})}</b><br>`+series.map(({r,p})=>{const q=p.find(x=>x.f===f);return `<span style="color:${COLOR[r]}">●</span> ${NOMBRE[r]}: <b>${q?fmtN(q.v):"—"}</b>`}).join("<br>"))};
  hit.onpointerleave=()=>{cr.setAttribute("visibility","hidden");ocultarTip()};
}
function graficoBarras(el,vids){

   <td class="num"><b>${fmtN(v.vistas)}</b></td><td class="num">${fmtN(v.likes)}</td><td class="num">${fmtN(v.comentarios)}</td><td class="num">${fmtN(v.compartidos)}</td><td class="num">${v.inter==null?"—":v.inter.toFixed(1)+" %"}</td></tr>`).join("")}</tbody></table>`;

  if(["inicio","stats","prod","cal","avisos"].includes(tab))ir(tab,true)},300000);
const VISTAS={inicio:vistaInicio,stats:vistaStats,cal:vistaCal,prod:vistaProd,nuevo:vistaNuevo,avisos:vistaAvisos,conex:vistaConex,ajustes:vistaAjustes};
async function ir(t,silencioso=false){
  tab=t;pintarNav();if(!silencioso){heroStop();ocultarTip();scrollTo({top:0})}
  const main=$("#app");
  if(!tok){main.innerHTML="";app=main;return pantallaToken()}
  const [h,p]=TITULOS[t];
  if(silencioso&&$("#cont")){const y=scrollY;const tmp=document.createElement("div");app=tmp;try{await VISTAS[t]();if(t==="inicio")heroStop();$("#cont").replaceChildren(...tmp.childNodes);app=$("#cont");if(t==="inicio"&&$("#h3d"))heroStart($("#h3d"));scrollTo({top:y})}catch(e){}return}
  main.innerHTML=`<div class="ph fade"><div><h1>${h}</h1><p>${p}</p></div></div><div id="cont"><div class="card"><div class="skel" style="width:60%"></div><br><div class="skel"></div><br><div class="skel" style="width:80%"></div></div></div>`;
  app=$("#cont");
  try{await VISTAS[t]()}catch(e){if(e.status===401)return pantallaToken("El token ha caducado o no es válido.");app.innerHTML=`<div class="card msg err">${esc(e.message)}</div>`}
}
tab="inicio";pintarNav();ir("inicio");
if(tok){gh("/issues?state=open&per_page=50").then(i=>contarAvisos(i.filter(x=>!x.pull_request).length)).catch(()=>{});
 leerArchivo("produccion/estado.json").then(f=>{const v=JSON.parse(f.txt).videos;contarProd(v.filter(x=>x.estado==="revision"||x.estado==="propuesto").length)}).catch(()=>{})}
