<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control del directo</title>
<style>
@font-face { font-family: "Poppins"; src: url("Poppins-Bold.ttf") format("truetype"); font-weight: 700; }
:root { --fondo: #0f1430; --tarjeta: #1a2148; --texto: #eef1ff; --suave: #a9b1d6; --a: #2f9bff; --b: #ff4d6d; --oro: #ffd02e; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--fondo); color: var(--texto); font: 15px/1.45 system-ui, sans-serif; padding: 16px; }
h1 { font: 700 20px "Poppins", sans-serif; margin: 0 0 12px; }
.fila { display: flex; gap: 10px; flex-wrap: wrap; }
.tarjeta { background: var(--tarjeta); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
.marcador { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; text-align: center; }
.eq { border-radius: 12px; padding: 10px; } .eq b { display: block; font: 700 30px "Poppins", sans-serif; }
.ea { background: var(--a); } .eb { background: var(--b); }
#tiempo { font: 700 28px "Poppins", sans-serif; min-width: 90px; } #fase { color: var(--suave); font-size: 13px; }
button { font: 700 15px "Poppins", sans-serif; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; background: #2c3570; color: #fff; }
button.prin { background: var(--oro); color: #111; } button:active { transform: scale(.97); }
#nota { font-size: 16px; } .suave { color: var(--suave); font-size: 13px; }
#estado { font-size: 13px; padding: 4px 10px; border-radius: 99px; background: #2c3570; display: inline-block; }
ol { margin: 6px 0 0; padding-left: 20px; } li.actual { color: var(--oro); }
kbd { background: #fff; color: #111; border-radius: 5px; padding: 0 6px; font-size: 12px; }
</style>
</head>
<body>
<h1>🎛️ Control del directo · Duelos de objetos <span id="estado">…</span></h1>
<div class="tarjeta marcador">
  <div class="eq ea"><span id="nA">—</span><b id="pA">0</b></div>
  <div><div id="tiempo">–</div><div id="fase"></div></div>
  <div class="eq eb"><span id="nB">—</span><b id="pB">0</b></div>
</div>
<div class="tarjeta fila">
  <button class="prin" data-o="siguiente" id="bSig">▶ Empezar</button>
  <button data-o="pausa" id="bPausa">⏸ Pausa</button>
  <button data-o="prensa">⬇ Prensa ya</button>
  <button data-o="mas">+30 s</button>
  <button data-o="menos">−30 s</button>
  <button data-o="auto" id="bAuto">Automático</button>
  <button data-o="simular" id="bSim">Simulador</button>
</div>
<div class="tarjeta"><div class="suave">TU CHULETA (solo la ves tú)</div><div id="nota">Pulsa «Empezar» cuando estés en directo.</div></div>
<div class="tarjeta"><div class="suave">LOS QUE MÁS APOYAN</div><div class="fila" style="justify-content:space-between"><div>A: <span id="tA">—</span></div><div>B: <span id="tB">—</span></div></div></div>
<div class="tarjeta"><div class="suave">DUELOS (en este orden)</div><ol id="lista"></ol></div>
<p class="suave">También funcionan las teclas en la pantalla del directo: <kbd>N</kbd> siguiente · <kbd>Espacio</kbd> pausa · <kbd>P</kbd> prensa · <kbd>↑</kbd><kbd>↓</kbd> ±30 s.</p>
<script>
const $ = id => document.getElementById(id);
let E = null, off = 0, ws, duelos = [];
fetch("/duelos.json").then(r => r.json()).then(d => { duelos = d.duelos; pintarLista(); }).catch(() => {});
function pintarLista() { $("lista").innerHTML = duelos.map((d, i) => `<li class="${E && E.duelo && JSON.stringify(E.duelo) === JSON.stringify(d) ? "actual" : ""}">${d.a.nombre} vs ${d.b.nombre}</li>`).join(""); }
function conectar() {
  ws = new WebSocket(`ws://${location.host}/eventos`);
  ws.onmessage = ev => { const m = JSON.parse(ev.data); if (m.tipo !== "estado") return; E = m; off = m.ahora - Date.now(); pintar(); };
  ws.onclose = () => { $("estado").textContent = "Sin conexión con el programa"; setTimeout(conectar, 1500); };
}
function pintar() {
  const d = E.duelo;
  $("nA").textContent = d ? "A · " + d.a.nombre : "A"; $("nB").textContent = d ? "B · " + d.b.nombre : "B";
  $("pA").textContent = E.puntos.a; $("pB").textContent = E.puntos.b;
  $("fase").textContent = (E.pausa ? "EN PAUSA · " : "") + { espera: "esperando", votacion: "votación", prensa: "¡prensa!", resultado: "resultado" }[E.fase];
  $("nota").textContent = d ? d.nota : "Pulsa «Empezar» cuando estés en directo.";
  $("tA").textContent = E.top.a.map(x => `${x.nombre} (${x.puntos})`).join(", ") || "—";
  $("tB").textContent = E.top.b.map(x => `${x.nombre} (${x.puntos})`).join(", ") || "—";
  $("estado").textContent = E.simulacion ? "🧪 Simulador" : E.conectado ? `🟢 Conectado a @${E.usuario}` : `🔴 ${E.mensaje || "Sin directo"}`;
  $("bSig").textContent = E.fase === "espera" ? "▶ Empezar" : "⏭ Siguiente duelo";
  $("bPausa").textContent = E.pausa ? "▶ Seguir" : "⏸ Pausa";
  $("bAuto").textContent = "Automático: " + (E.auto ? "sí" : "no"); $("bSim").textContent = "Simulador: " + (E.simulacion ? "sí" : "no");
  pintarLista();
}
setInterval(() => { if (!E) return; const q = E.pausa ? E.restante / 1000 : Math.max(0, (E.fin - Date.now() - off) / 1000);
  $("tiempo").textContent = E.fase === "votacion" ? `${Math.floor(q / 60)}:${String(Math.floor(q % 60)).padStart(2, "0")}` : "–"; }, 200);
document.querySelectorAll("button[data-o]").forEach(b => b.onclick = () => {
  let o = b.dataset.o; if (o === "siguiente" && E?.fase === "espera") o = "empezar";
  if (o === "simular" && !E?.simulacion && !confirm("El simulador mete votos y regalos falsos. ¿Activarlo? (solo para probar, nunca en directo)")) return;
  ws?.readyState === 1 && ws.send(JSON.stringify({ orden: o }));
});
conectar();
</script>
</body>
</html>
