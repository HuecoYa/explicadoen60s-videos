<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duelos de objetos</title>
<style>
@font-face { font-family: "Poppins"; src: url("Poppins-Bold.ttf") format("truetype"); font-weight: 700; }
:root {
  --a: #2f9bff; --a2: #0b5fb8; --b: #ff4d6d; --b2: #b8173a; --oro: #ffd02e; --tinta: #0d1226; --blanco: #ffffff;
  --panel: rgba(10, 14, 32, 0.78);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1024; font-family: "Poppins", system-ui, sans-serif; color: var(--blanco); }
html, body { background: #000; }
/* Escenario fijo de 1080×1920 (9:16), escalado para caber en cualquier ventana sin deformarse */
#escenario { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; overflow: hidden; background: #0b1024;
  transform: translate(-50%, -50%) scale(var(--k, 0.5)); transform-origin: center center; }
#escenario canvas { display: block; position: absolute; left: 0; top: 0; width: 1080px !important; height: 1920px !important; }
#capa { position: absolute; inset: 0; pointer-events: none; }
.sombra { text-shadow: 0 6.7px 0 rgba(0,0,0,.45), 0 0 23px rgba(0,0,0,.35); }

/* ── Marcador (arriba, por debajo de la zona segura de 150 px) ── */
#marcador { position: absolute; left: 4%; right: 13%; top: 165.1px; }
#titulo { display: flex; justify-content: center; margin-bottom: 19.2px; }
#titulo span { background: var(--oro); color: var(--tinta); font-size: 40.3px; letter-spacing: 4.8px; padding: 9.6px 38.4px; border-radius: 1900.8px; box-shadow: 0 9.6px 0 rgba(0,0,0,.35); }
#fila { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 23px; }
.equipo { border-radius: 42.2px; padding: 23px 26.9px 21.1px; text-align: center; position: relative; box-shadow: 0 13.4px 0 rgba(0,0,0,.35); transition: transform .15s; }
#eqA { background: linear-gradient(160deg, var(--a), var(--a2)); }
#eqB { background: linear-gradient(200deg, var(--b), var(--b2)); }
.letra { position: absolute; top: -30.7px; left: 50%; transform: translateX(-50%); width: 80.6px; height: 80.6px; border-radius: 50%; background: var(--blanco); color: var(--tinta); font-size: 49.9px; line-height: 80.6px; box-shadow: 0 7.7px 0 rgba(0,0,0,.3); }
.nombre { font-size: 48px; line-height: 1.1; margin-top: 28.8px; min-height: 53.8px; }
.puntos { font-size: 84.5px; line-height: 1.05; }
.lider { font-size: 27.8px; opacity: .95; min-height: 36.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.golpe { animation: golpe .35s ease-out; }
@keyframes golpe { 0% { transform: scale(1); } 35% { transform: scale(1.09) rotate(-1.5deg); } 100% { transform: scale(1); } }

#reloj { width: 201.6px; height: 201.6px; position: relative; }
#reloj svg { width: 100%; height: 100%; transform: rotate(-90deg); }
#reloj .fondo { stroke: rgba(255,255,255,.18); }
#reloj .arco { stroke: var(--oro); stroke-linecap: round; transition: stroke-dashoffset .25s linear, stroke .3s; }
#reloj b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 65.3px; }
#reloj i { position: absolute; left: 0; right: 0; bottom: -49.9px; text-align: center; font-style: normal; font-size: 30.7px; letter-spacing: 5.8px; opacity: .9; }
#reloj.urgente b { color: #ff5a5a; animation: late .5s infinite alternate; }
#reloj.urgente .arco { stroke: #ff5a5a; }
@keyframes late { to { transform: scale(1.18); } }

#barra { margin-top: 57.6px; height: 61.4px; border-radius: 1900.8px; overflow: hidden; display: flex; background: rgba(255,255,255,.15); box-shadow: 0 9.6px 0 rgba(0,0,0,.35); position: relative; }
#barA { background: linear-gradient(90deg, var(--a2), var(--a)); width: 50%; transition: width .5s cubic-bezier(.2,1.4,.4,1); }
#barB { background: linear-gradient(270deg, var(--b2), var(--b)); flex: 1; }
#barra .pct { position: absolute; top: 0; bottom: 0; display: grid; place-items: center; font-size: 36.5px; padding: 0 26.9px; }
#pctA { left: 0; } #pctB { right: 0; }
#chispa { position: absolute; top: -11.5px; bottom: -11.5px; width: 19.2px; background: #fff; border-radius: 1900.8px; box-shadow: 0 0 38.4px 19.2px rgba(255,255,255,.7); transition: left .5s cubic-bezier(.2,1.4,.4,1); left: 50%; transform: translateX(-50%); }

/* ── Instrucciones (por encima del chat del directo) ── */
#instr { margin-top: 19.2px; text-align: center; }
#instr .grande { display: inline-block; background: var(--panel); border: 4.8px solid rgba(255,255,255,.15); padding: 9.6px 38.4px; border-radius: 1900.8px; font-size: 36.5px; }
#instr .grande em { font-style: normal; padding: 0 17.3px; border-radius: 19.2px; margin: 0 5.8px; }
#instr .a { background: var(--a); } #instr .b { background: var(--b); }
#instr .peq { font-size: 30.7px; }
#instr .peq em { font-style: normal; padding: 0 13.4px; border-radius: 15.4px; }
#instr .peq b { color: var(--oro); }

/* ── Avisos de regalos y votos ── */
#feed { position: absolute; left: 4%; right: 13%; top: 1296px; height: 200px; display: flex; flex-direction: column-reverse; align-items: center; gap: 13.4px; overflow: hidden; }
.toast { display: flex; align-items: center; gap: 19.2px; padding: 11.5px 30.7px 11.5px 11.5px; border-radius: 1900.8px; font-size: 32px; background: var(--panel); border: 5.8px solid rgba(255,255,255,.2); animation: entra .45s cubic-bezier(.2,1.6,.4,1); white-space: nowrap; max-width: 100%; }
.toast.a { border-color: var(--a); } .toast.b { border-color: var(--b); }
.toast .av { width: 65.3px; height: 65.3px; border-radius: 50%; background: #445 center/cover; display: grid; place-items: center; font-size: 32.6px; flex: none; }
.toast .mas { color: var(--oro); }
.toast.sale { animation: sale .4s forwards; }
@keyframes entra { from { transform: translateY(57.6px) scale(.6); opacity: 0; } }
@keyframes sale { to { transform: scale(.7); opacity: 0; } }

/* ── Banners grandes ── */
#banner { position: absolute; left: 4%; right: 13%; top: 714px; text-align: center; opacity: 0; transform: scale(.4); }
#banner.ver { animation: banner 2s cubic-bezier(.2,1.5,.4,1) forwards; }
@keyframes banner { 0% { opacity: 0; transform: scale(.3) rotate(-8deg); } 12% { opacity: 1; transform: scale(1.12) rotate(2deg); } 20% { transform: scale(1) rotate(-2deg); } 85% { opacity: 1; transform: scale(1) rotate(-2deg); } 100% { opacity: 0; transform: scale(1.3) rotate(-2deg); } }
#banner .t1 { display: inline-flex; align-items: baseline; gap: 16px; max-width: 100%; background: var(--oro); color: var(--tinta); font-size: 48px; line-height: 1.15; padding: 6px 28px; border-radius: 30px; box-shadow: 0 12px 0 rgba(0,0,0,.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#banner .t1 small { font-size: 26px; opacity: .85; overflow: hidden; text-overflow: ellipsis; }
#banner .t1 small:empty { display: none; }

/* ── Resultado ── */
#resultado { position: absolute; left: 4%; right: 13%; top: 240px; text-align: center; display: none; }
#resultado.ver { display: block; animation: entra .5s cubic-bezier(.2,1.6,.4,1); }
#rNom { font-size: 40px; margin-top: 10px; }
#sello { display: inline-block; font-size: 76px; color: #ff3b3b; border: 12px solid #ff3b3b; padding: 0 40px; border-radius: 30.7px; transform: rotate(-7deg); background: rgba(10,14,32,.6); letter-spacing: 5.8px; }
#resultado .quien { margin-top: 14px; background: var(--panel); border-radius: 30px; padding: 12px 28px; font-size: 36.5px; display: inline-block; min-width: 70%; }
#resultado .quien h4 { font-size: 24px; opacity: .8; font-weight: 700; letter-spacing: 3px; margin-bottom: 2px; }
#resultado .quien p { font-size: 36px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 780px; }

#conexion { position: absolute; left: 38.4px; top: 28.8px; font-size: 26.9px; padding: 5.8px 19.2px; border-radius: 1900.8px; background: rgba(0,0,0,.5); opacity: .85; }
#conexion:empty { display: none; }
#ayuda { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(5,8,20,.94); border-radius: 38.4px; padding: 46.1px 57.6px; font-size: 34.6px; line-height: 1.7; display: none; pointer-events: auto; }
#ayuda.ver { display: block; }
#ayuda kbd { background: #fff; color: #111; border-radius: 11.5px; padding: 0 15.4px; font-family: inherit; }
#espera { position: absolute; left: 4%; right: 13%; top: 860px; text-align: center; display: none; }
#espera.ver { display: block; }
#espera .t1 { font-size: 88.3px; line-height: 1.1; }
#espera .t2 { font-size: 42.2px; margin-top: 23px; opacity: .9; }
</style>
</head>
<body>
<div id="escenario">
<div id="capa">
  <div id="conexion"></div>
  <div id="marcador">
    <div id="titulo"><span id="tit">DUELO DE OBJETOS</span></div>
    <div id="fila">
      <div class="equipo" id="eqA"><div class="letra">A</div><div class="nombre sombra" id="nA">—</div><div class="puntos sombra" id="pA">0</div><div class="lider" id="lA"></div></div>
      <div id="reloj"><svg viewBox="0 0 100 100"><circle class="fondo" cx="50" cy="50" r="44" fill="none" stroke-width="9"/><circle class="arco" id="arco" cx="50" cy="50" r="44" fill="none" stroke-width="9" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><b id="seg">–</b><i id="fase">VOTA</i></div>
      <div class="equipo" id="eqB"><div class="letra">B</div><div class="nombre sombra" id="nB">—</div><div class="puntos sombra" id="pB">0</div><div class="lider" id="lB"></div></div>
    </div>
    <div id="barra"><div id="barA"></div><div id="barB"></div><div id="chispa"></div><div class="pct sombra" id="pctA">50%</div><div class="pct sombra" id="pctB">50%</div></div>
    <div id="instr"><div class="peq sombra" id="reglas"></div></div>
  </div>
  <div id="banner"><div class="t1"><span id="b1"></span><small id="b2"></small></div></div>
  <div id="resultado"><div id="sello">¡CRAC!</div><div class="sombra" id="rNom"></div><div class="quien"><h4 id="rT1">A LA PRENSA LO MANDARON</h4><p id="rP1"></p></div><br><div class="quien" style="margin-top:19.2px"><h4>LO DEFENDIERON</h4><p id="rP2"></p></div></div>
  <div id="espera"><div class="t1 sombra">¿QUÉ AGUANTA MÁS?</div><div class="t2 sombra">El duelo empieza enseguida</div></div>
  <div id="feed"></div>
  
  <div id="ayuda"><b>Teclas</b><br><kbd>N</kbd> empezar / siguiente duelo · <kbd>Espacio</kbd> pausa<br><kbd>P</kbd> prensa ya · <kbd>↑</kbd><kbd>↓</kbd> ±30 s<br><kbd>A</kbd> automático sí/no · <kbd>S</kbd> simulador<br><kbd>M</kbd> sonido · <kbd>F</kbd> pantalla completa · <kbd>H</kbd> esta ayuda</div>
</div>

</div>
<script type="module">
import * as THREE from "/three/build/three.module.js";
import { crearObjeto } from "./objetos.js";

// ═════════════ Escena 3D ═════════════
const $ = id => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById("escenario").prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 9 / 16, 0.1, 100);

// fondo degradado con focos
{ const c = document.createElement("canvas"); c.width = 16; c.height = 512; const x = c.getContext("2d");
  const g = x.createLinearGradient(0, 0, 0, 512); g.addColorStop(0, "#1a1f4d"); g.addColorStop(0.55, "#2a1650"); g.addColorStop(1, "#0b0f22");
  x.fillStyle = g; x.fillRect(0, 0, 16, 512); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t; }
scene.fog = new THREE.Fog(0x14123a, 14, 34);
scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x2a1a40, 1.15));
const sol = new THREE.DirectionalLight(0xffffff, 2.1); sol.position.set(4, 10, 7); sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048); Object.assign(sol.shadow.camera, { left: -6, right: 6, top: 8, bottom: -3, near: 1, far: 30 }); sol.shadow.radius = 4; scene.add(sol);
const focoA = new THREE.PointLight(0x2f9bff, 0, 7); focoA.position.set(-1.2, 2.6, 3.2); scene.add(focoA);
const focoB = new THREE.PointLight(0xff4d6d, 0, 7); focoB.position.set(1.2, 2.6, 3.2); scene.add(focoB);

const L = (c, o = {}) => new THREE.MeshLambertMaterial({ color: c, ...o });
function caja(w, h, d, c, x, y, z, padre = scene) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), c.isMaterial ? c : L(c)); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; padre.add(m); return m; }
function cil(r, h, c, x, y, z, padre = scene, seg = 40) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), c.isMaterial ? c : L(c)); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; padre.add(m); return m; }
function rayas() { const c = document.createElement("canvas"); c.width = 256; c.height = 32; const x = c.getContext("2d");
  x.fillStyle = "#ffcf1f"; x.fillRect(0, 0, 256, 32); x.fillStyle = "#16161c"; for (let i = -2; i < 12; i++) { x.beginPath(); x.moveTo(i * 32, 32); x.lineTo(i * 32 + 16, 32); x.lineTo(i * 32 + 32, 0); x.lineTo(i * 32 + 16, 0); x.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping; t.repeat.x = 2; return t; }

// suelo del plató
const suelo = new THREE.Mesh(new THREE.CircleGeometry(16, 64), L(0x1b1d33)); suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; scene.add(suelo);
for (let k = 1; k <= 6; k++) { const r = new THREE.Mesh(new THREE.RingGeometry(k * 1.6, k * 1.6 + 0.03, 96), new THREE.MeshBasicMaterial({ color: 0x3a3f75, transparent: true, opacity: 0.6 })); r.rotation.x = -Math.PI / 2; r.position.y = 0.005; scene.add(r); }

// prensa hidráulica
const PLATO = 0.35;           // altura de la mesa de la prensa
const REPOSO = 4.35;          // altura de la cara inferior del pisón en reposo
const prensa = new THREE.Group(); scene.add(prensa);
caja(3.8, PLATO, 2.2, 0x3a3e4a, 0, PLATO / 2, 0, prensa);
caja(2.6, 0.04, 1.6, 0x565b6a, 0, PLATO + 0.02, 0, prensa);
for (const x of [-1.75, 1.75]) { caja(0.34, 5.3, 0.6, 0xffc21f, x, 2.65 + PLATO * 0, 0, prensa); caja(0.5, 0.25, 0.8, 0x2b2e38, x, 0.12 + PLATO, 0, prensa); }
const viga = caja(4.0, 0.62, 0.86, L(0xffc21f), 0, 5.55, 0, prensa);
const frente = new THREE.Mesh(new THREE.PlaneGeometry(4.0, 0.62), new THREE.MeshLambertMaterial({ map: rayas() })); frente.position.set(0, 5.55, 0.431); prensa.add(frente);
cil(0.48, 0.75, 0x6c7180, 0, 4.88, 0, prensa);
const vastago = cil(0.22, 1, 0xdfe4ee, 0, 4.4, 0, prensa);
const pison = new THREE.Group(); prensa.add(pison);
caja(2.5, 0.32, 1.5, 0x2b2e38, 0, 0.16, 0, pison);
const bordePison = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 0.16), new THREE.MeshLambertMaterial({ map: rayas() })); bordePison.position.set(0, 0.16, 0.751); pison.add(bordePison);
function ponerPison(yInf) { pison.position.y = yInf; const top = yInf + 0.32, fin = 4.5; vastago.scale.y = Math.max(0.01, fin - top); vastago.position.y = (fin + top) / 2; }
ponerPison(REPOSO);

// pedestales de los equipos
const PED = { a: new THREE.Vector3(-0.78, 0, 2.3), b: new THREE.Vector3(0.78, 0, 2.3) };
const anillos = {}, pedG = {};
for (const lado of ["a", "b"]) {
  const col = lado === "a" ? 0x2f9bff : 0xff4d6d;
  const pg = new THREE.Group(); scene.add(pg); pedG[lado] = pg;
  cil(0.56, 0.42, 0x262a40, PED[lado].x, 0.21, PED[lado].z, pg);
  const an = new THREE.Mesh(new THREE.TorusGeometry(0.56, 0.04, 10, 64), new THREE.MeshBasicMaterial({ color: col })); an.rotation.x = Math.PI / 2; an.position.set(PED[lado].x, 0.42, PED[lado].z); pg.add(an); anillos[lado] = an;
  const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d"); x.fillStyle = lado === "a" ? "#2f9bff" : "#ff4d6d"; x.beginPath(); x.arc(64, 64, 60, 0, 7); x.fill();
  x.fillStyle = "#fff"; x.font = "bold 84px Poppins, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(lado.toUpperCase(), 64, 70);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const pl = new THREE.Mesh(new THREE.CircleGeometry(0.17, 32), new THREE.MeshBasicMaterial({ map: t })); pl.position.set(PED[lado].x, 0.21, PED[lado].z + 0.565); pg.add(pl);
}
const ALTO_PED = 0.42;

// ═════════════ Estado de la pantalla ═════════════
let E = null, offset = 0, faseLocal = null, inicioFase = 0;
const obj = { a: null, b: null };        // { o: crearObjeto(), base: Vector3, wob }
let restos = [], monedas = [], gotas = [], charco = null, roto = false;
let sonido = true, ctxAudio = null;
const ahora = () => Date.now() + offset;

function limpiarDuelo() {
  for (const l of ["a", "b"]) if (obj[l]) { scene.remove(obj[l].o.g); obj[l] = null; }
  for (const r of [...restos, ...gotas]) scene.remove(r.m); restos = []; gotas = [];
  if (charco) { scene.remove(charco); charco = null; } roto = false;
}
function montarDuelo(d) {
  limpiarDuelo(); if (!d) return;
  for (const l of ["a", "b"]) {
    const o = crearObjeto(d[l].modelo);
    // todos caben en el pedestal: como mucho 1,05 de ancho y 1,75 de alto
    const bb = new THREE.Box3().setFromObject(o.g), tam = bb.getSize(new THREE.Vector3());
    const k = Math.min(1.25, 1.05 / Math.max(tam.x, tam.z), 1.75 / tam.y); o.g.scale.setScalar(k); o.h *= k; o.k = k;
    const nodo = new THREE.Group(); nodo.add(o.g); o.g = nodo;
    o.g.position.set(PED[l].x, ALTO_PED, PED[l].z); scene.add(o.g);
    obj[l] = { o, base: o.g.position.clone(), wob: 0, rot0: o.g.rotation.y, sx: 1, sy: 1 };
  }
}

// ═════════════ Partículas ═════════════
const geoTrozo = new THREE.TetrahedronGeometry(0.09), geoPieza = new THREE.BoxGeometry(0.12, 0.12, 0.12), geoGota = new THREE.SphereGeometry(0.05, 8, 6), geoMoneda = new THREE.CylinderGeometry(0.11, 0.11, 0.03, 20);
const matMoneda = L(0xffcc22, { emissive: 0x6b4a00 });
function lanzar(lista, geo, color, pos, v, vida = 999) { const m = new THREE.Mesh(geo, color.isMaterial ? color : L(color)); m.position.copy(pos); m.castShadow = true; scene.add(m); const p = { m, v, w: new THREE.Vector3(Math.random() * 8 - 4, Math.random() * 8 - 4, 0), vida, quieto: false }; lista.push(p); return p; }
function suelos(p) { return (Math.abs(p.x) < 1.9 && Math.abs(p.z) < 1.1) ? PLATO + 0.04 : 0.02; }
function paso(lista, dt, g = -9.8) {
  for (const p of lista) {
    p.vida -= dt; if (p.quieto) continue;
    p.v.y += g * dt; p.m.position.addScaledVector(p.v, dt); p.m.rotation.x += p.w.x * dt; p.m.rotation.y += p.w.y * dt;
    const f = suelos(p.m.position);
    if (p.m.position.y < f) { p.m.position.y = f; p.v.y *= -0.35; p.v.x *= 0.6; p.v.z *= 0.6; p.w.multiplyScalar(0.6); if (Math.abs(p.v.y) < 0.4 && p.v.length() < 0.5) p.quieto = true; }
    if (p.m.position.y > f + 0.001 && f > 0.1 && p.m.position.y < PLATO + 0.3 && p.m.position.y > pison.position.y - 0.05) p.m.position.y = Math.max(f, pison.position.y - 0.05);
  }
}

function lluviaMonedas(lado, cuantas) {
  const dst = lado ? obj[lado]?.base || PED[lado] : new THREE.Vector3(0, 1, 2);
  for (let k = 0; k < cuantas; k++) {
    const desde = new THREE.Vector3(dst.x + (Math.random() - .5) * 0.6, 7 + Math.random() * 1.5, dst.z + (Math.random() - .5) * 0.6);
    const p = lanzar(monedas, geoMoneda, matMoneda, desde, new THREE.Vector3((Math.random() - .5) * 0.8, -2 - Math.random() * 3, (Math.random() - .5) * 0.8), 1.4 + Math.random() * 0.6);
    p.w.set(Math.random() * 14, Math.random() * 14, 0);
  }
}

// ═════════════ Aplastar ═════════════
function romper(o, lado) {
  const est = o.estilo, c = obj[lado].o.g.position.clone(); roto = true;
  const n = est === "aplasta" ? 14 : est === "revienta" ? 50 : 70;
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, sp = (est === "aplasta" ? 1.2 : 3) + Math.random() * 3.5;

      lanzar(gotas, geoGota, new THREE.MeshLambertMaterial({ color: o.jugo }), c.clone().add(new THREE.Vector3(0, 0.25, 0)), new THREE.Vector3(Math.cos(a) * sp, 1 + Math.random() * 3.5, Math.sin(a) * sp * 0.6)); }

    charco.rotation.x = -Math.PI / 2; charco.position.set(0, PLATO + 0.045, 0); charco.scale.setScalar(0.01); scene.add(charco);

}

// ═════════════ Cámara ═════════════
const CAM = {
  // encuadres calculados para 1080×1920: objetos entre y≈805 y y≈1265 px (debajo del marcador y encima de los avisos)
  voto: { p: new THREE.Vector3(0, 3.6, 12.3), t: new THREE.Vector3(0, 1.15, 1.2) },
  prensa: { p: new THREE.Vector3(0, 4.5, 8.2), t: new THREE.Vector3(0, 1.4, 0) },
  golpe: { p: new THREE.Vector3(0.3, 4.1, 7.5), t: new THREE.Vector3(0, 1.3, 0) },

const camP = CAM.voto.p.clone(), camT = CAM.voto.t.clone(); let temblor = 0;

// ═════════════ Bucle ═════════════
const reloj = new THREE.Clock(); let tGlobal = 0;
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
function animar() {
  const dt = Math.min(0.05, reloj.getDelta()); tGlobal += dt;

  let objetivo = CAM.voto, yPison = REPOSO;

  // objetos en sus pedestales

    const q = obj[l]; if (!q) continue;
    q.wob *= Math.pow(0.04, dt);
    const enPrensa = (fase === "prensa" || fase === "resultado") && E.aplastado === l;
    if (!enPrensa) {
      const fuera = fase === "prensa" || fase === "resultado";
      const aparte = fuera ? new THREE.Vector3(Math.sign(q.base.x) * 1.22, 0.02, 0.95) : q.base;
      q.o.g.position.lerp(aparte, 1 - Math.pow(0.1, dt)); q.o.g.position.y = aparte.y + Math.sin(tGlobal * 2 + (l === "a" ? 0 : 1.5)) * 0.04;
      q.o.g.rotation.y = q.rot0 + Math.sin(tGlobal * 0.7 + (l === "a" ? 0 : 2)) * 0.5 + Math.sin(tGlobal * 25) * q.wob * 0.2;
      q.o.g.rotation.z = Math.sin(tGlobal * 21) * q.wob * 0.15; q.o.g.scale.setScalar(THREE.MathUtils.lerp(q.o.g.scale.x, fuera ? 0.62 : 1, 1 - Math.pow(0.1, dt)));
      const ll = q.o.g.getObjectByName("llama"); if (ll) ll.scale.set(1 + Math.sin(tGlobal * 17) * 0.15, 2.2 + Math.sin(tGlobal * 11) * 0.4, 1);
    }
  }
  { const abajo = fase === "prensa" || fase === "resultado"; const kp = 1 - Math.pow(0.05, dt);
    for (const l of ["a", "b"]) { pedG[l].position.y = THREE.MathUtils.lerp(pedG[l].position.y, abajo ? -0.5 : 0, kp); pedG[l].visible = pedG[l].position.y > -0.48; } }
  focoA.intensity = THREE.MathUtils.lerp(focoA.intensity, (E?.puntos?.a || 0) >= (E?.puntos?.b || 0) && fase === "votacion" ? 9 : 2.5, 0.05);
  focoB.intensity = THREE.MathUtils.lerp(focoB.intensity, (E?.puntos?.b || 0) > (E?.puntos?.a || 0) && fase === "votacion" ? 9 : 2.5, 0.05);

  anillos.b.material.color.setHex(0xff4d6d).multiplyScalar(0.8 + 0.4 * Math.sin(tGlobal * 4 + 1.5));

  // la prensa: salto al plato, bajada rápida, aplastado a cámara lenta, subida
  if ((fase === "prensa" || fase === "resultado") && E.aplastado && obj[E.aplastado]) {
    const q = obj[E.aplastado], o = q.o, t = fase === "resultado" ? 99 : tf;
    const hop = ease(t / 1.3); const dest = new THREE.Vector3(0, PLATO + 0.04, 0);
    q.o.g.position.lerpVectors(q.base, dest, hop); q.o.g.position.y += Math.sin(hop * Math.PI) * 1.4; q.o.g.rotation.y = q.rot0 + hop * Math.PI * 2;
    const arriba = PLATO + 0.04 + o.h;
    if (t < 1.6) yPison = REPOSO;
    else if (t < 2.6) yPison = THREE.MathUtils.lerp(REPOSO, arriba + 0.06, ease((t - 1.6) / 1.0));
    else if (t < 8.6) yPison = THREE.MathUtils.lerp(arriba + 0.06, PLATO + 0.04 + o.h * 0.1, Math.pow((t - 2.6) / 6.0, 1.6));
    else if (t < 10.4) yPison = PLATO + 0.04 + o.h * 0.1;
    else yPison = THREE.MathUtils.lerp(PLATO + 0.04 + o.h * 0.1, REPOSO, ease((t - 10.4) / 2.2));

    const sMin = q.sMin ?? 1; q.sMin = Math.min(sMin, s);

    const umbral = { estalla: 0.86, piezas: 0.78, revienta: 0.72, aplasta: 0.45 }[o.estilo];
    if (!roto && sy < umbral && fase === "prensa") romper(o, E.aplastado);
    if (fase === "prensa" && t > 2.6 && t < 8.6) { temblor = Math.max(temblor, 0.06); if (Math.floor(t * 6) !== Math.floor((t - dt) * 6)) sfx.cruje(); }
    if (charco) charco.scale.setScalar(Math.min(0.75, charco.scale.x + dt * 0.8));

  // partículas (cámara lenta justo al romper)
  const lento = roto && E?.fase === "prensa" ? 0.45 : 1;
  paso(restos, dt * lento); paso(gotas, dt * lento);
  paso(monedas, dt, -6);
  for (const m of monedas) { if (m.vida < 0.4) m.m.scale.setScalar(Math.max(0.01, m.vida / 0.4)); if (m.vida < 0) { scene.remove(m.m); m.borrar = true; } }
  monedas = monedas.filter(m => !m.borrar);

  const kc = 1 - Math.pow(0.15, dt); camP.lerp(objetivo.p, kc); camT.lerp(objetivo.t, kc); temblor *= Math.pow(0.08, dt);
  camera.position.copy(camP).add(new THREE.Vector3(Math.sin(tGlobal * 0.31) * 0.25 + (Math.random() - .5) * temblor * 0.25, Math.sin(tGlobal * 0.23) * 0.12 + (Math.random() - .5) * temblor * 0.25, 0));

}

function ajustar() {
  renderer.setSize(1080, 1920, false); camera.aspect = 9 / 16; camera.fov = 50; camera.updateProjectionMatrix();
  document.documentElement.style.setProperty("--k", Math.min(innerWidth / 1080, innerHeight / 1920));
}
addEventListener("resize", ajustar); ajustar(); animar();

// ═════════════ Capa 2D ═════════════
const fmt = n => n >= 10000 ? (n / 1000).toFixed(1).replace(".", ",") + " k" : String(n);
let mostrados = { a: 0, b: 0 };
function contar(el, lado, valor) {
  const ini = mostrados[lado], t0 = performance.now(); mostrados[lado] = valor;
  const f = () => { const u = Math.min(1, (performance.now() - t0) / 500); el.textContent = fmt(Math.round(ini + (valor - ini) * u)); if (u < 1) requestAnimationFrame(f); }; f();
}
function pintar() {
  if (!E) return;
  const d = E.duelo, fase = E.fase;
  $("tit").textContent = fase === "espera" || !d ? "DUELO DE OBJETOS" : `DUELO #${E.numero} · ¿QUÉ AGUANTA MÁS?`;
  $("nA").textContent = d ? d.a.nombre : "—"; $("nB").textContent = d ? d.b.nombre : "—";
  if (mostrados.a !== E.puntos.a) contar($("pA"), "a", E.puntos.a);
  if (mostrados.b !== E.puntos.b) contar($("pB"), "b", E.puntos.b);
  const tot = E.puntos.a + E.puntos.b, pa = tot ? Math.round(E.puntos.a / tot * 100) : 50;
  $("barA").style.width = pa + "%"; $("chispa").style.left = pa + "%"; $("pctA").textContent = pa + "%"; $("pctB").textContent = (100 - pa) + "%";
  $("lA").textContent = E.top.a[0] ? "👑 " + E.top.a[0].nombre : ""; $("lB").textContent = E.top.b[0] ? "👑 " + E.top.b[0].nombre : "";
  $("fase").textContent = E.pausa ? "PAUSA" : { votacion: "VOTA", prensa: "PRENSA", resultado: "¡HECHO!", espera: "" }[fase];
  $("instr").style.display = fase === "votacion" ? "" : "none";
  $("espera").classList.toggle("ver", fase === "espera");
  $("reglas").innerHTML = `Escribe <em class="a">A</em> o <em class="b">B</em> · 🪙 1 moneda = <b>${E.reglas.moneda} votos</b>`;
  $("conexion").textContent = E.simulacion ? "SIMULACIÓN" : (!E.conectado ? (E.mensaje || "Sin conexión con TikTok") : "");
  if (E.mensaje && E.conectado) banner(E.mensaje, "");
  const r = $("resultado");
  if (fase === "resultado" && d) {
    const l = E.aplastado, otro = l === "a" ? "b" : "a";
    $("rNom").textContent = `${d[l].nombre}: no ha aguantado`;
    $("rP1").textContent = E.top[l].map(x => x.nombre).join(" · ") || "el público";
    $("rP2").textContent = E.top[otro].map(x => x.nombre).join(" · ") || "nadie… 😢";
    r.classList.add("ver");

}
function relojTick() {
  if (E) {
    const queda = E.pausa ? E.restante / 1000 : Math.max(0, (E.fin - ahora()) / 1000);
    const total = E.fase === "votacion" ? (E.totalVoto || 120) : 1;
    $("seg").textContent = E.fase === "votacion" ? (queda >= 60 ? `${Math.floor(queda / 60)}:${String(Math.floor(queda % 60)).padStart(2, "0")}` : Math.ceil(queda)) : (E.fase === "prensa" ? "⬇" : "✓");
    $("arco").style.strokeDashoffset = E.fase === "votacion" ? 276.5 * (1 - Math.min(1, queda / total)) : 0;
    const urg = E.fase === "votacion" && queda <= 10 && !E.pausa; $("reloj").classList.toggle("urgente", urg);
    if (urg && Math.ceil(queda) !== relojTick.ult) { relojTick.ult = Math.ceil(queda); sfx.tic(queda <= 3); }

relojTick();

let ultBanner = "";
function banner(t1, t2, color) {
  if (t1 + t2 === ultBanner) return; ultBanner = t1 + t2; setTimeout(() => ultBanner = "", 2700);
  const b = $("banner"); $("b1").textContent = t1; $("b2").textContent = t2; $("b1").parentNode.style.background = color || ""; $("b1").parentNode.style.color = color ? "#fff" : ""; b.classList.remove("ver"); void b.offsetWidth; b.classList.add("ver");
}
function toast(html, lado, foto) {
  const f = $("feed"), d = document.createElement("div"); d.className = "toast " + (lado || "");
  d.innerHTML = `<span class="av" style="${foto ? `background-image:url('${foto}')` : ""}">${foto ? "" : "👤"}</span>${html}`;
  f.prepend(d); while (f.children.length > 3) f.lastChild.remove();
  setTimeout(() => { d.classList.add("sale"); setTimeout(() => d.remove(), 400); }, 3800);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const golpe = lado => { const e = $(lado === "a" ? "eqA" : "eqB"); e.classList.remove("golpe"); void e.offsetWidth; e.classList.add("golpe"); };

// ═════════════ Sonidos (sintetizados, sin archivos) ═════════════
const sfx = (() => {
  const c = () => (sonido && ctxAudio && ctxAudio.state === "running") ? ctxAudio : null;
  const tono = (f0, f1, dur, tipo = "sine", vol = 0.2, retardo = 0) => { const a = c(); if (!a) return; const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + retardo;

    voto: () => tono(600, 900, 0.08, "triangle", 0.08),
    mega: () => { [523, 659, 784, 1046].forEach((f, k) => tono(f, f * 1.01, 0.35, "square", 0.07, k * 0.09)); ruido(0.6, 3000, 0.15); },
    tic: fuerte => tono(fuerte ? 1100 : 800, fuerte ? 1000 : 700, 0.06, "square", fuerte ? 0.1 : 0.05),
    cruje: () => ruido(0.12, 900 + Math.random() * 900, 0.18),
    crujido: () => { ruido(0.9, 2500, 0.45); tono(110, 40, 0.6, "sine", 0.5); },
    golpe: () => tono(80, 35, 0.5, "sine", 0.6),
    fanfarria: () => [392, 523, 659, 784].forEach((f, k) => tono(f, f, 0.22, "triangle", 0.09, k * 0.12)),

})();

// ═════════════ Conexión con el servidor ═════════════
let ws;
function conectar() {
  ws = new WebSocket(`ws://${location.host}/eventos`);
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.tipo === "estado") {
      offset = m.ahora - Date.now();
      const nuevoDuelo = !E || E.numero !== m.numero || JSON.stringify(E.duelo) !== JSON.stringify(m.duelo);
      if (m.fase !== faseLocal) {
        inicioFase = m.fase === "prensa" ? m.fin - (m.reglas?.prensa || 14) * 1000 : ahora();
        if (m.fase === "prensa") { sfx.golpe(); banner("¡A LA PRENSA!", m.duelo?.[m.aplastado]?.nombre || "", "#ff4d6d"); }
        if (m.fase === "resultado") sfx.fanfarria();
        if (m.fase === "votacion" && faseLocal !== null) { banner(`DUELO #${m.numero}`, `${m.duelo.a.nombre}  vs  ${m.duelo.b.nombre}`); }
        faseLocal = m.fase;
      }
      if (m.fase === "votacion") m.totalVoto = Math.max(E?.totalVoto && !nuevoDuelo ? E.totalVoto : 0, (m.fin - m.ahora) / 1000);
      if (nuevoDuelo) { montarDuelo(m.duelo); mostrados = { a: 0, b: 0 }; obj.a && (obj.a.sMin = undefined); obj.b && (obj.b.sMin = undefined); }
      E = m; pintar();
    } else if (m.tipo === "voto") {
      toast(`<b>${esc(m.nombre)}</b>&nbsp;vota <b>${m.lado.toUpperCase()}</b>${m.puntos > 1 ? `&nbsp;<span class="mas">+${fmt(m.puntos)}</span>` : ""}`, m.lado, m.foto);
      sfx.voto(); if (obj[m.lado]) obj[m.lado].wob = Math.max(obj[m.lado].wob, 0.25); golpe(m.lado);
    } else if (m.tipo === "regalo") {
      const lado = m.lado;
      const txt = `<b>${esc(m.nombre)}</b>&nbsp;🎁 ${esc(m.regalo)}${m.cuenta ? (lado ? `&nbsp;<span class="mas">+${fmt(m.puntos)} para ${lado.toUpperCase()}</span>` : `&nbsp;· escribe A o B para sumar <span class="mas">+${fmt(m.puntos)}</span>`) : ""}`;
      toast(txt, lado, m.foto); if (E?.fase === "votacion") lluviaMonedas(lado, Math.min(24, 3 + Math.round(Math.sqrt(m.monedas) * 2))); sfx.moneda(Math.min(6, 1 + Math.round(Math.log2(m.monedas + 1))));
      if (lado && obj[lado]) { obj[lado].wob = Math.min(1.2, obj[lado].wob + 0.4 + m.monedas / 100); golpe(lado); }
      if (m.monedas >= 99 && E?.fase === "votacion") { banner("¡MEGA REGALO!", `${m.nombre} · ${m.regalo}${m.cuenta && lado ? ` · +${fmt(m.puntos)} para ${lado.toUpperCase()}` : ""}`); sfx.mega(); vibrar(1); }
    } else if (m.tipo === "seguidor") {

    }
  };
  ws.onclose = () => { E && (E.conectado = false); setTimeout(conectar, 1500); };
}
conectar();

// ═════════════ Teclado ═════════════
const orden = o => ws?.readyState === 1 && ws.send(JSON.stringify({ orden: o }));
addEventListener("keydown", e => {
  if (ctxAudio?.state === "suspended") ctxAudio.resume(); else if (!ctxAudio && sonido) try { ctxAudio = new AudioContext(); } catch {}
  const k = e.key.toLowerCase();
  if (k === "n") orden(E?.fase === "espera" ? "empezar" : "siguiente");
  else if (k === " ") { e.preventDefault(); orden("pausa"); }
  else if (k === "p" || k === "enter") orden("prensa");
  else if (k === "arrowup") orden("mas"); else if (k === "arrowdown") orden("menos");
  else if (k === "a") orden("auto"); else if (k === "s") orden("simular");
  else if (k === "m") { sonido = !sonido; banner(sonido ? "🔊 Sonido" : "🔇 Sin sonido", ""); }
  else if (k === "h") $("ayuda").classList.toggle("ver");
  else if (k === "f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();

addEventListener("pointerdown", () => { if (!ctxAudio) try { ctxAudio = new AudioContext(); } catch {} else ctxAudio.resume(); });
window.__listo = true;
