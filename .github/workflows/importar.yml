name: Guardar vídeos nuevos

# Los vídeos se suben a la rama temporal «subida»; esta acción los guarda en el release «videos»
# (que no ocupa espacio del repositorio) y borra la rama.
on:
  push:
    branches: [subida]

concurrency:
  group: importar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subida
      - name: Subir al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view videos >/dev/null 2>&1 || gh release create videos --title "Vídeos para publicar" --notes "Almacén de vídeos del programador. No borrar." --latest=false
          for f in videos/*.mp4; do
            [ -f "$f" ] || continue
            gh release upload videos "$f" --clobber
            echo "guardado $(basename "$f")"
          done
      - name: Borrar la rama temporal
        run: git push origin --delete subida
