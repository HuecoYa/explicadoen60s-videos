name: Generar voces

# Al aprobar guiones en el panel genera su voz con la voz del dueño (Qwen3-TTS, gratis). Una máquina por guion, en paralelo.
on:
  push:
    branches: [main]
    paths: [produccion/estado.json, .github/workflows/voz.yml]
  workflow_dispatch:

concurrency:
  group: voces
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lista:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.l.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: produccion
      - id: l
        run: echo "ids=$(cd produccion && python3 voces.py lista)" >> $GITHUB_OUTPUT

  voz:
    needs: lista
    if: needs.lista.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.lista.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: produccion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen3-tts-base-1.7b
      - name: Hacer sitio en el disco (el runner a veces se queda sin espacio)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h / | tail -1
      - run: |
          sudo apt-get install -y -qq ffmpeg sox > /dev/null
          # PyTorch sin CUDA: ocupa una décima parte y aquí no hay tarjeta gráfica
          pip install -q --no-cache-dir torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q --no-cache-dir qwen-tts soundfile numpy
      - name: Voz de ${{ matrix.id }}
        working-directory: produccion
        run: python3 voces.py generar "${{ matrix.id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: voz-${{ matrix.id }}
          path: |
            produccion/escenas/${{ matrix.id }}.mp3
            produccion/escenas/${{ matrix.id }}.txt

  guardar:
    needs: [lista, voz]
    if: always() && needs.lista.outputs.ids != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: produccion
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/voces
          merge-multiple: true
      - name: Guardar voces
        env:
          IDS: ${{ needs.lista.outputs.ids }}
        run: |
          git config user.name "programador-explicadoen60s"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ids=$(python3 -c "import json,os;print(' '.join(json.loads(os.environ['IDS'])))")
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/voces/* produccion/escenas/ 2>/dev/null || true
            (cd produccion && python3 voces.py marcar $ids)
            git add produccion/escenas produccion/estado.json
            git diff --cached --quiet && exit 0
            git commit -qm "Producción: voces generadas [skip ci]"
            git push -q && exit 0; sleep 6
          done
          exit 1
