name: Generar voces

# Al aprobar guiones en el panel (cambia produccion/estado.json) genera su voz con la voz del dueño (Qwen3-TTS, gratis).
on:
  push:
    branches: [main]
    paths: [produccion/estado.json]
  workflow_dispatch:

concurrency:
  group: estado-produccion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: produccion
      - name: ¿Hay guiones aprobados?
        id: hay
        run: echo "n=$(python3 -c "import json;print(sum(v.get('estado')=='aprobado' for v in json.load(open('produccion/estado.json'))['videos']))")" >> $GITHUB_OUTPUT
      - if: steps.hay.outputs.n != '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.hay.outputs.n != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen3-tts-base-1.7b
      - if: steps.hay.outputs.n != '0'
        run: |
          sudo apt-get install -y -qq ffmpeg sox > /dev/null
          pip install -q qwen-tts soundfile numpy
      - if: steps.hay.outputs.n != '0'
        name: Generar con tu voz
        working-directory: produccion
        run: python3 voces.py
      - if: steps.hay.outputs.n != '0'
        name: Guardar
        run: |
          git config user.name "programador-explicadoen60s"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add produccion/estado.json produccion/escenas
          git diff --cached --quiet && exit 0
          git commit -qm "Producción: voces generadas [skip ci]"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; sleep 7; done
