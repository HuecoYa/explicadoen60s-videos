name: Publicar vídeos programados

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: programador
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: programador
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests cryptography
      - name: Publicar lo que toca
        working-directory: programador
        env:
          CLAVE_TOKENS: ${{ secrets.CLAVE_TOKENS }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python publicar.py
      - name: Guardar estado
        if: always()
        run: |
          git config user.name "programador-explicadoen60s"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programador/calendario.json programador/tokens.enc CALENDARIO.md 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "Programador: estado actualizado [skip ci]"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
