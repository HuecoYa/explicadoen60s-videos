name: Probar voces

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        nombre: [qwen_icl, qwen_xvec, vc_qwen, vc_piper]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            produccion/voz_pruebas
            produccion/voz
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get install -y -qq espeak-ng ffmpeg sox > /dev/null
      - name: Generar
        run: |
          set -o pipefail
          P=produccion/voz_pruebas/probar2.py; REF=produccion/voz/referencia.wav; LARGA=produccion/voz/referencia_larga.wav
          n=${{ matrix.nombre }}
          {
          if [ $n = qwen_icl ]; then
            pip install -q qwen-tts soundfile faster-whisper
            python $P transcribir $REF /tmp/ref.txt
            python $P qwen_icl $REF /tmp/out.wav /tmp/ref.txt
          elif [ $n = qwen_xvec ]; then
            pip install -q qwen-tts soundfile
            python $P qwen_xvec $LARGA /tmp/out.wav
          elif [ $n = vc_qwen ]; then
            python -m venv /tmp/q && /tmp/q/bin/pip install -q qwen-tts soundfile
            /tmp/q/bin/python $P qwen_diseno /tmp/src.wav
            python -m venv /tmp/c && /tmp/c/bin/pip install -q chatterbox-tts soundfile
            /tmp/c/bin/python $P vc /tmp/src.wav $LARGA /tmp/out.wav
            ffmpeg -loglevel error -y -i /tmp/src.wav -b:a 128k /tmp/voz_fuente_qwen.mp3
          else
            pip install -q piper-tts soundfile chatterbox-tts
            base=https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium/es_ES-davefx-medium
            curl -sL -o /tmp/m.onnx "$base.onnx"; curl -sL -o /tmp/m.onnx.json "$base.onnx.json"
            python $P piper /tmp/m.onnx /tmp/src.wav
            python $P vc /tmp/src.wav $LARGA /tmp/out.wav
          fi
          } 2>&1 | grep -v "Warning\|warn" | tail -40 | tee /tmp/log.txt
          ffmpeg -loglevel error -y -i /tmp/out.wav -b:a 128k /tmp/voz_$n.mp3
      - name: Subir
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=${{ matrix.nombre }}
          cp /tmp/log.txt /tmp/log_$n.txt 2>/dev/null || echo "sin log" > /tmp/log_$n.txt
          gh release upload voces-prueba /tmp/log_$n.txt --clobber
          for f in /tmp/voz_$n.mp3 /tmp/voz_fuente_qwen.mp3; do [ -f $f ] && gh release upload voces-prueba $f --clobber; done; true
